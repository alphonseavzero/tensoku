<script>

const $=id=>document.getElementById(id);


/* ========================================
   太陽方位角計算
======================================== */

function calculateSunAzimuth(
  obsLatDeg,
  obsLonDeg,
  localDate
){

  const rad=d=>d*Math.PI/180;
  const deg=r=>r*180/Math.PI;

  const lonOffset=Math.round(obsLonDeg/15);

  const utcTime=
    localDate.getTime()
    -
    (localDate.getTimezoneOffset()*60000)
    -
    (lonOffset*3600000);

  const utcDate=new Date(utcTime);

  const JD=
    utcDate.getTime()/86400000
    +
    2440587.5;

  const T=
    (JD-2451545)/36525;

  const L=
    (280.46646+36000.76983*T)%360;

  const G=
    (357.52911+35999.05029*T)%360;

  const C=
    1.914602*Math.sin(rad(G))
    +
    .019993*Math.sin(rad(2*G));

  const Lambda=
    (L+C)%360;

  const Epsilon=
    rad(23.439291-.0130042*T);

  const RA=
    deg(
      Math.atan2(
        Math.cos(Epsilon)*Math.sin(rad(Lambda)),
        Math.cos(rad(Lambda))
      )
    );

  const Dec=
    Math.asin(
      Math.sin(Epsilon)*Math.sin(rad(Lambda))
    );

  const GST=
    (
      280.46061837
      +
      360.98564736629*(JD-2451545)
    )%360;

  const LHA=
    rad(
      (GST+obsLonDeg)%360
      -
      RA
    );

  const phi=
    rad(obsLatDeg);

  const Az=
    (
      deg(
        Math.atan2(
          Math.sin(LHA),
          Math.cos(LHA)*Math.sin(phi)
          -
          Math.tan(Dec)*Math.cos(phi)
        )
      )
      +
      360
    )%360;

  return ((Az+180)%360).toFixed(2);
}

const presetSelect=$("preset-location");

    option.textContent=

/* ========================================
   計算実行
======================================== */

function doCalc(){

  const y=parseInt($("year").value);
  const m=parseInt($("month").value);
  const d=parseInt($("day").value);

  const hh=parseInt($("hour").value);
  const mm=parseInt($("minute").value);

  const latDeg=parseFloat($("lat-deg").value);
  const latMin=parseFloat($("lat-min").value);

  const lonDeg=parseFloat($("lon-deg").value);
  const lonMin=parseFloat($("lon-min").value);

  if(
    ![
      y,m,d,hh,mm,
      latDeg,latMin,
      lonDeg,lonMin
    ].every(Number.isFinite)
  ){
    return;
  }

  const lat=
    (latDeg+latMin/60)
    *
    ($("lat-dir").value==="N"?1:-1);

  const lon=
    (lonDeg+lonMin/60)
    *
    ($("lon-dir").value==="E"?1:-1);

  const date=
    new Date(
      y,
      m-1,
      d,
      hh,
      mm
    );

  $("azimuth-result").textContent=
    calculateSunAzimuth(
      lat,
      lon,
      date
    );

  $("result-message").textContent=
    `計算: ${y}/${m}/${d} ${hh}:${String(mm).padStart(2,"0")}\n`
    +
    `緯度: ${lat.toFixed(4)}°\n`
    +
    `経度: ${lon.toFixed(4)}°`;
}


/* ========================================
   現在日時
======================================== */

const now=new Date();

$("year").value=
  now.getFullYear();

$("month").value=
  now.getMonth()+1;

$("day").value=
  now.getDate();

$("hour").value=
  now.getHours();

$("minute").value=
  now.getMinutes();


/* ========================================
   入力変更
======================================== */

["year","month","day","hour","minute"]
.forEach(
  id=>
    $(id).addEventListener(
      "input",
      doCalc
    )
);

[
  "lat-deg",
  "lat-min",
  "lon-deg",
  "lon-min",
  "lat-dir",
  "lon-dir"
]
.forEach(
  id=>{
    $(id).addEventListener(
      "input",
      doCalc
    );

    $(id).addEventListener(
      "change",
      doCalc
    );
  }
);


/* ========================================
   ▲ ▼ ボタン
======================================== */

document
.querySelectorAll(".step-button")
.forEach(
  button=>
    button.addEventListener(
      "click",
      ()=>{

        const input=
          $(button.dataset.target);

        const step=
          parseFloat(
            button.dataset.step
          );

        const change=
          parseFloat(
            button.dataset.change
          );

        const min=
          parseFloat(input.min);

        const max=
          parseFloat(input.max);

        const current=
          parseFloat(input.value)||0;

        const next=
          Math.min(
            max,
            Math.max(
              min,
              current+step*change
            )
          );

        input.value=
          Number.isInteger(next)
          ? String(next)
          : next.toFixed(1);

        doCalc();

      }
    )
);


/* ========================================
   プリセット選択
======================================== */

$("preset-location").onchange=
  e=>{

    const p=
      PRESETS[e.target.value];

    if(!p)return;

    $("lat-deg").value=
      p.latD;

    $("lat-min").value=
      p.latM;

    $("lat-dir").value=
      p.latDir;

    $("lon-deg").value=
      p.lonD;

    $("lon-min").value=
      p.lonM;

    $("lon-dir").value=
      p.lonDir;

    $("gps-status").textContent=
      "プリセット地点を選択しました。";

    doCalc();

  };


/* ========================================
   GPS座標変換
======================================== */

function decimalToDegMin(decimal){

  const absolute=
    Math.abs(decimal);

  let degrees=
    Math.floor(absolute);

  let minutes=
    Math.round(
      (absolute-degrees)
      *60*100
    )/100;

  if(minutes>=60){

    degrees+=1;
    minutes=0;

  }

  return{
    degrees,
    minutes
  };

}


/* ========================================
   現在位置取得
======================================== */

function getCurrentLocation(){

  const status=
    $("gps-status");

  const button=
    $("get-location");

  if(!navigator.geolocation){

    status.textContent=
      "このiPhone / ブラウザでは位置情報を利用できません。";

    return;

  }

  button.disabled=true;

  button.textContent=
    "📍 現在位置を取得中…";

  status.textContent=
    "位置情報を取得しています。\n"
    +
    "iPhoneの位置情報使用許可が表示された場合は「許可」を選択してください。";

  navigator.geolocation.getCurrentPosition(

    position=>{

      const latitude=
        position.coords.latitude;

      const longitude=
        position.coords.longitude;

      const accuracy=
        position.coords.accuracy;

      const lat=
        decimalToDegMin(
          latitude
        );

      const lon=
        decimalToDegMin(
          longitude
        );

      $("lat-deg").value=
        lat.degrees;

      $("lat-min").value=
        lat.minutes;

      $("lat-dir").value=
        latitude>=0
        ?"N"
        :"S";

      $("lon-deg").value=
        lon.degrees;

      $("lon-min").value=
        lon.minutes;

      $("lon-dir").value=
        longitude>=0
        ?"E"
        :"W";

      $("preset-location").value=
        "";

      status.textContent=
        "現在位置を取得しました。\n"
        +
        `緯度：${Math.abs(latitude).toFixed(6)}° ${latitude>=0?"N":"S"}\n`
        +
        `経度：${Math.abs(longitude).toFixed(6)}° ${longitude>=0?"E":"W"}\n`
        +
        `測位精度：約${Math.round(accuracy)} m`;

      doCalc();

      button.disabled=false;

      button.textContent=
        "📍 現在位置を取得";

    },

    error=>{

      let message;

      switch(error.code){

        case error.PERMISSION_DENIED:

          message=
            "位置情報の使用が許可されていません。\n"
            +
            "iPhoneの「設定」→「プライバシーとセキュリティ」→「位置情報サービス」を確認してください。";

          break;

        case error.POSITION_UNAVAILABLE:

          message=
            "現在位置を取得できませんでした。\n"
            +
            "屋外などGPSを受信しやすい場所でもう一度お試しください。";

          break;

        case error.TIMEOUT:

          message=
            "位置情報の取得がタイムアウトしました。\n"
            +
            "もう一度「現在位置を取得」を押してください。";

          break;

        default:

          message=
            "位置情報の取得に失敗しました。";

      }

      status.textContent=
        message;

      button.disabled=false;

      button.textContent=
        "📍 現在位置を取得";

    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }

  );

}


/* ========================================
   GPSボタン
======================================== */

$("get-location")
.addEventListener(
  "click",
  getCurrentLocation
);


/* ========================================
   初期計算
======================================== */

doCalc();
