<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>太陽方位角計算</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#007bff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="太陽方位角">

<style>
body {
    font-family: sans-serif;
    margin: 0;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    background-color: #f0f2f5;
    color: #333;
    display: flex;
    justify-content: center;
}

.container {
    background-color: #ffffff;
    padding: 15px;
    margin: 5px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 500px;
    box-sizing: border-box;
}

h1 {
    color: #007bff;
    text-align: center;
    font-size: 1.2em;
    margin: 0 0 10px 0;
}

.section-title {
    font-size: 0.85em;
    font-weight: bold;
    margin-bottom: 5px;
    color: #666;
    border-left: 3px solid #007bff;
    padding-left: 5px;
}

.input-section {
    margin-bottom: 10px;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
}

label {
    display: block;
    font-size: 0.75em;
    color: #777;
    margin-bottom: 2px;
}

input[type="number"],
select {
    width: 100%;
    padding: 5px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
    font-size: 0.9em;
    height: 32px;
}

.number-stepper {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 28px;
    grid-template-rows: 16px 16px;
}

.number-stepper input {
    grid-row: 1 / 3;
    grid-column: 1;
    border-radius: 4px 0 0 4px;
}

.step-button {
    grid-column: 2;
    padding: 0;
    border: 1px solid #aaa;
    background: #f8f8f8;
    color: #333;
    font-size: 11px;
    line-height: 14px;
    cursor: pointer;
}

.step-button:hover,
.step-button:active {
    background: #dcecff;
}

.step-up {
    grid-row: 1;
    border-radius: 0 4px 0 0;
}

.step-down {
    grid-row: 2;
    border-top: none;
    border-radius: 0 0 4px 0;
}

.grid-row {
    display: grid;
    gap: 5px;
    margin-bottom: 8px;
}

.coord-grid {
    grid-template-columns: 1.5fr 1.5fr 1fr;
}

.date-grid {
    grid-template-columns: 1.25fr 0.8fr 0.8fr 1.55fr 1.55fr;
}

.date-grid > div {
    min-width: 0;
}

.result-section {
    margin-top: 10px;
    padding: 15px;
    border: 2px solid #007bff;
    border-radius: 6px;
    text-align: center;
    background-color: #e9f7ff;
}

#azimuth-result {
    font-size: 3em;
    font-weight: bold;
    color: #dc3545;
    line-height: 1;
    margin: 5px 0;
}

#azimuth-unit {
    font-size: 0.9em;
    color: #dc3545;
    font-weight: bold;
}

.message-box {
    margin-top: 8px;
    padding: 8px;
    background-color: #fff;
    border: 1px solid #eee;
    border-radius: 4px;
    text-align: left;
    font-size: 0.75em;
    color: #666;
    white-space: pre-wrap;
    line-height: 1.4;
}
</style>
</head>

<body>
<div class="container">
<h1>太陽方位角計算</h1>

<div class="input-section">
<div style="margin-bottom:8px;">
<label>プリセット</label>
<select id="preset-location">
<option value="">--- 選択 ---</option>
</select>
</div>

<div class="section-title">観測地点</div>

<div class="grid-row coord-grid">
<div>
<label>緯度(度)</label>
<div class="number-stepper">
<input type="number" id="lat-deg" value="33" min="0" max="90" step="1">
<button type="button" class="step-button step-up" data-target="lat-deg" data-step="1" data-change="1" aria-label="緯度を増やす">▲</button>
<button type="button" class="step-button step-down" data-target="lat-deg" data-step="1" data-change="-1" aria-label="緯度を減らす">▼</button>
</div>
</div>

<div>
<label>緯度(分)</label>
<div class="number-stepper">
<input type="number" id="lat-min" value="9" min="0" max="59" step="1">
<button type="button" class="step-button step-up" data-target="lat-min" data-step="1" data-change="1" aria-label="緯度の分を増やす">▲</button>
<button type="button" class="step-button step-down" data-target="lat-min" data-step="1" data-change="-1" aria-label="緯度の分を減らす">▼</button>
</div>
</div>

<div>
<label>方向</label>
<select id="lat-dir">
<option value="N">N</option>
<option value="S">S</option>
</select>
</div>
</div>

<div class="grid-row coord-grid">
<div>
<label>経度(度)</label>
<div class="number-stepper">
<input type="number" id="lon-deg" value="129" min="0" max="180" step="1">
<button type="button" class="step-button step-up" data-target="lon-deg" data-step="1" data-change="1" aria-label="経度を増やす">▲</button>
<button type="button" class="step-button step-down" data-target="lon-deg" data-step="1" data-change="-1" aria-label="経度を減らす">▼</button>
</div>
</div>

<div>
<label>経度(分)</label>
<div class="number-stepper">
<input type="number" id="lon-min" value="42" min="0" max="59" step="1">
<button type="button" class="step-button step-up" data-target="lon-min" data-step="1" data-change="1" aria-label="経度の分を増やす">▲</button>
<button type="button" class="step-button step-down" data-target="lon-min" data-step="1" data-change="-1" aria-label="経度の分を減らす">▼</button>
</div>
</div>

<div>
<label>方向</label>
<select id="lon-dir">
<option value="E">E</option>
<option value="W">W</option>
</select>
</div>
</div>
</div>

<div class="input-section">
<div class="section-title">日時 (地方時)</div>

<div class="grid-row date-grid">
<div>
<label>年</label>
<input type="number" id="year">
</div>

<div>
<label>月</label>
<input type="number" id="month">
</div>

<div>
<label>日</label>
<input type="number" id="day">
</div>

<div>
<label>時</label>
<div class="number-stepper">
<input type="number" id="hour" min="0" max="23" step="1">
<button type="button" class="step-button step-up" data-target="hour" data-step="1" data-change="1" aria-label="時を増やす">▲</button>
<button type="button" class="step-button step-down" data-target="hour" data-step="1" data-change="-1" aria-label="時を減らす">▼</button>
</div>
</div>

<div>
<label>分</label>
<div class="number-stepper">
<input type="number" id="minute" min="0" max="59" step="1">
<button type="button" class="step-button step-up" data-target="minute" data-step="1" data-change="1" aria-label="分を増やす">▲</button>
<button type="button" class="step-button step-down" data-target="minute" data-step="1" data-change="-1" aria-label="分を減らす">▼</button>
</div>
</div>
</div>
</div>

<div class="result-section">
<div id="azimuth-result">---</div>
<div id="azimuth-unit">度 (南=0°, 東回り)</div>
<div class="message-box" id="result-message"></div>
</div>
</div>

<script>
const $ = (id) => document.getElementById(id);

/* =========================
   太陽方位角計算
   ========================= */
function calculateSunAzimuth(obsLatDeg, obsLonDeg, localDate) {
    const rad = (d) => d * Math.PI / 180;
    const deg = (r) => r * 180 / Math.PI;

    const lonOffset = Math.round(obsLonDeg / 15);

    const utcTime =
        localDate.getTime()
        - (localDate.getTimezoneOffset() * 60000)
        - (lonOffset * 3600000);

    const utcDate = new Date(utcTime);

    const JD =
        (utcDate.getTime() / 86400000)
        + 2440587.5;

    const T =
        (JD - 2451545.0) / 36525;

    const L =
        (280.46646 + 36000.76983 * T) % 360;

    const G =
        (357.52911 + 35999.05029 * T) % 360;

    const C =
        1.914602 * Math.sin(rad(G))
        + 0.019993 * Math.sin(rad(2 * G));

    const Lambda =
        (L + C) % 360;

    const Epsilon =
        rad(23.439291 - 0.0130042 * T);

    const RA =
        deg(Math.atan2(
            Math.cos(Epsilon) *
            Math.sin(rad(Lambda)),
            Math.cos(rad(Lambda))
        ));

    const Dec =
        Math.asin(
            Math.sin(Epsilon) *
            Math.sin(rad(Lambda))
        );

    const GST =
        (280.46061837
        + 360.98564736629 *
        (JD - 2451545.0)) % 360;

    const LHA =
        rad(
            (GST + obsLonDeg) % 360
            - RA
        );

    const phi =
        rad(obsLatDeg);

    const Az =
        (
            deg(Math.atan2(
                Math.sin(LHA),
                Math.cos(LHA) *
                Math.sin(phi)
                - Math.tan(Dec) *
                Math.cos(phi)
            ))
            + 360
        ) % 360;

    return ((Az + 180) % 360).toFixed(2);
}

/* =========================
   プリセット
   ※このデータが表示・計算の唯一の基準
   ========================= */
const PRESETS = {
    sasebo: { name: "佐世保", latD: 33, latM: 9, lonD: 129, lonM: 42, latDir: "N", lonDir: "E" },
    tokyo: { name: "東京", latD: 35, latM: 41, lonD: 139, lonM: 41, latDir: "N", lonDir: "E" },
    shimonoseki: { name: "下関", latD: 33, latM: 56, lonD: 130, lonM: 55, latDir: "N", lonDir: "E" },
    nagasaki: { name: "長崎", latD: 32, latM: 45, lonD: 129, lonM: 52, latDir: "N", lonDir: "E" },
    itoman: { name: "糸満", latD: 26, latM: 8, lonD: 127, lonM: 41, latDir: "N", lonDir: "E" },
    hirado: { name: "平戸", latD: 33, latM: 22, lonD: 129, lonM: 33, latDir: "N", lonDir: "E" },
    oshima: { name: "大島（西海市）", latD: 33, latM: 3, lonD: 129, lonM: 38, latDir: "N", lonDir: "E" },
    namura: { name: "名村（伊万里市）", latD: 33, latM: 20, lonD: 129, lonM: 50, latDir: "N", lonDir: "E" },
    jmu_ariake: { name: "JMU有明", latD: 32, latM: 55, lonD: 130, lonM: 27, latDir: "N", lonDir: "E" },
    nagoya: { name: "名古屋港（愛知県）", latD: 35, latM: 3, lonD: 136, lonM: 51, latDir: "N", lonDir: "E" },
    chiba: { name: "千葉港（千葉県）", latD: 35, latM: 34, lonD: 140, lonM: 3, latDir: "N", lonDir: "E" },
    yokohama: { name: "横浜港（神奈川県）", latD: 35, latM: 27, lonD: 139, lonM: 40, latDir: "N", lonDir: "E" },
    kitakyushu: { name: "北九州港（福岡県）", latD: 33, latM: 54, lonD: 130, lonM: 57, latDir: "N", lonDir: "E" },
    kobe: { name: "神戸港（兵庫県）", latD: 34, latM: 40, lonD: 135, lonM: 13, latDir: "N", lonDir: "E" },
    kawasaki: { name: "川崎港（神奈川県）", latD: 35, latM: 31, lonD: 139, lonM: 45, latDir: "N", lonDir: "E" },
    osaka: { name: "大阪港（大阪府）", latD: 34, latM: 39, lonD: 135, lonM: 25, latDir: "N", lonDir: "E" },
    mizushima: { name: "水島港（岡山県）", latD: 34, latM: 28, lonD: 133, lonM: 43, latDir: "N", lonDir: "E" },
    tomakomai: { name: "苫小牧港（北海道）", latD: 42, latM: 38, lonD: 141, lonM: 38, latDir: "N", lonDir: "E" },
    kashima: { name: "鹿島港（茨城県）", latD: 35, latM: 55, lonD: 140, lonM: 41, latDir: "N", lonDir: "E" }
};

/* =========================
   プリセット表示
   ========================= */
const presetSelect = $("preset-location");

Object.entries(PRESETS).forEach(([key, p]) => {
    const option = document.createElement("option");
    option.value = key;
    option.textContent =
        `${p.name} ` +
        `(${p.latD}°${String(p.latM).padStart(2, "0")}'${p.latDir}, ` +
        `${p.lonD}°${String(p.lonM).padStart(2, "0")}'${p.lonDir})`;
    presetSelect.appendChild(option);
});

/* =========================
   計算
   ========================= */
function doCalc() {
    const y = parseInt($("year").value);
    const m = parseInt($("month").value);
    const d = parseInt($("day").value);
    const hh = parseInt($("hour").value);
    const mm = parseInt($("minute").value);

    const lat =
        (parseFloat($("lat-deg").value) +
        parseFloat($("lat-min").value) / 60) *
        ($("lat-dir").value === "N" ? 1 : -1);

    const lon =
        (parseFloat($("lon-deg").value) +
        parseFloat($("lon-min").value) / 60) *
        ($("lon-dir").value === "E" ? 1 : -1);

    const date = new Date(y, m - 1, d, hh, mm);

    const az = calculateSunAzimuth(lat, lon, date);

    $("azimuth-result").textContent = az;

    $("result-message").textContent =
        `計算: ${y}/${m}/${d} ${hh}:${String(mm).padStart(2, "0")}\n` +
        `緯度: ${lat.toFixed(4)}°\n` +
        `経度: ${lon.toFixed(4)}°`;
}

/* =========================
   現在日時
   ========================= */
const now = new Date();

$("year").value = now.getFullYear();
$("month").value = now.getMonth() + 1;
$("day").value = now.getDate();
$("hour").value = now.getHours();
$("minute").value = now.getMinutes();

/* =========================
   入力イベント
   ========================= */
["year", "month", "day", "hour", "minute"].forEach((id) => {
    $(id).addEventListener("input", doCalc);
});

["lat-deg", "lat-min", "lon-deg", "lon-min", "lat-dir", "lon-dir"].forEach((id) => {
    $(id).addEventListener("input", doCalc);
    $(id).addEventListener("change", doCalc);
});

/* =========================
   ▲ ▼ ボタン
   ========================= */
document.querySelectorAll(".step-button").forEach((button) => {
    button.addEventListener("click", () => {
        const input = $(button.dataset.target);
        const step = parseFloat(button.dataset.step);
        const change = parseFloat(button.dataset.change);
        const min = parseFloat(input.min);
        const max = parseFloat(input.max);
        const current = parseFloat(input.value) || 0;

        const next = Math.min(
            max,
            Math.max(min, current + step * change)
        );

        input.value =
            Number.isInteger(next)
            ? String(next)
            : next.toFixed(1);

        doCalc();
    });
});

/* =========================
   プリセット選択
   ========================= */
$("preset-location").onchange = (e) => {
    const p = PRESETS[e.target.value];

    if (!p) return;

    $("lat-deg").value = p.latD;
    $("lat-min").value = p.latM;
    $("lat-dir").value = p.latDir;
    $("lon-deg").value = p.lonD;
    $("lon-min").value = p.lonM;
    $("lon-dir").value = p.lonDir;

    doCalc();
};

/* =========================
   PWA Service Worker
   ========================= */
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
            .catch((error) => {
                console.warn("Service Worker registration failed:", error);
            });
    });
}

/* =========================
   初期計算
   ========================= */
doCalc();
</script>
</body>
</html>
